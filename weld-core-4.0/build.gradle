
// Build.gradle generated for instrumentation module weld-core

apply plugin: 'java'

dependencies {
   implementation 'org.jboss.weld:weld-core-impl:6.0.2.Final'

   // New Relic Java Agent dependencies
   implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
   implementation fileTree(include: ['*.jar'], dir: '../libs')
   implementation fileTree(include: ['*.jar'], dir: '../test-lib')

   // Test dependencies
   testImplementation 'junit:junit:4.13.2'
   testImplementation 'org.mockito:mockito-core:3.12.4'
   testImplementation 'org.jboss.weld.se:weld-se-core:6.0.2.Final'
   testImplementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.weld-core-4.0'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': '2.5'
  }
}

verifyInstrumentation {
  // Verifier plugin documentation:
  // https://github.com/newrelic/newrelic-gradle-verify-instrumentation
  // Example:
  // passes 'javax.servlet:servlet-api:[2.2,2.5]'
  // exclude 'javax.servlet:servlet-api:2.4.public_draft'
	passesOnly 'org.jboss.weld:weld-core-impl:[4.0.0.Final,)'
    excludeRegex '.*Beta.*'
    excludeRegex '.*CR.*'
    excludeRegex '.*Alpha.*'
}
